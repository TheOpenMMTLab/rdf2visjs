<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ project.name }}</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/styles.css">

</head>
<body>
  <div class="page-bg-shape page-bg-shape-a"></div>
  <div class="page-bg-shape page-bg-shape-b"></div>

  <main class="page-shell graph-shell">
    <header class="hero-panel compact reveal">
      <a href="/" class="brand-link" title="Zur Startseite">
        <img src="/favicon.png" alt="Symbol" class="brand-icon">
        <span class="brand-name">RDF2Vis</span>
      </a>
      <h1>Projekt {{ project.name }}</h1>
      <p>Interaktive Netzwerkansicht für RDF-Modelle mit Filterung nach View.</p>
    </header>

    <section class="toolbar reveal" style="--delay: 0.08s;">
      <div class="toolbar-group">
        <label for="viewSelector">Ansicht</label>
        <select id="viewSelector">
          <option value="all">Alle</option>
        </select>
      </div>
      <div class="toolbar-actions">
        <button id="makeCluster" class="btn btn-secondary" type="button">Cluster bilden</button>
        <button id="clearCluster" class="btn" type="button">Cluster auflösen</button>
      </div>
    </section>

    <p id="graphError" class="error-banner" aria-live="polite"></p>
    <div id="network" class="reveal" style="--delay: 0.12s;"></div>
  </main>
  <div id="popup"></div>


  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>

  <script src="/js/scripts.js"></script>

  <script>
    $(document).ready(function() {
      loadGraph("{{ project.id }}");
  });
  </script>
  
  {% raw %}
  <script id="popup-template" type="text/x-handlebars-template">
    <div class="popup-container">
      
      <!-- TYP (kleiner Text oben) -->
      <div class="popup-type">{{type}}</div>

      <!-- HEADER mit Klasse -->
      <div class="popup-header">
        <strong class="class-name">{{label}}</strong>
      </div>

      <!-- BODY mit Kommentar und Attributtabelle -->
      <div class="popup-body">
        {{#if comment}}
        <p>{{comment}}</p>
        {{/if}}
        {{#if attributes}}
        <table class="popup-attributes">
          <thead>
            <tr><th>Attribut</th><th>Wert</th></tr>
          </thead>
          <tbody>
            {{#each attributes}}
            <tr>
              <td>{{@key}}</td>
              <td>{{this}}</td>
            </tr>
            {{/each}}
          </tbody>
        </table>
        {{/if}}
      </div>
    </div>
  </script>

  {% endraw %}
   
</body>
</html>
